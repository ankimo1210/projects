<!doctype html>
<html amp4email data-css-strict>
  <head>
    <meta charset="utf-8">
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script async custom-element="amp-bind" src="https://cdn.ampproject.org/v0/amp-bind-0.1.js"></script>
    <style amp4email-boilerplate>body{visibility:hidden}</style>
    <style amp-custom>
      body{margin:0;background:#f3f6fa;color:#142033;font-family:Arial,sans-serif}
      .shell{max-width:680px;margin:0 auto;padding:24px}
      .report{background:#fff;border:1px solid #dbe3ee;border-radius:12px;overflow:hidden}
      .header{padding:24px;background:#102a43;color:#fff}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#9fb3c8}
      h1{margin:7px 0 0;font-size:25px;line-height:1.25}
      .content{padding:24px}
      .summary{margin:0 0 18px;line-height:1.55;color:#334e68}
      .metric-button{margin:0 7px 8px 0;padding:9px 13px;border:1px solid #bcccdc;border-radius:6px;background:#fff;color:#243b53;font-weight:700;cursor:pointer}
      .metric-button-active{margin:0 7px 8px 0;padding:9px 13px;border:1px solid #137c8b;border-radius:6px;background:#e6fffa;color:#0f5964;font-weight:700;cursor:pointer}
      .chart{margin-top:8px;padding:18px;border:1px solid #dbe3ee;border-radius:8px}
      .headline{font-size:28px;font-weight:700;color:#102a43}
      .comparison{margin:4px 0 18px;font-size:13px;color:#627d98}
      .bar-row{display:flex;align-items:center;margin:10px 0}
      .bar-label{width:40px;font-size:12px;color:#486581}
      .bar-track{flex:1;height:18px;background:#edf2f7;border-radius:3px;overflow:hidden}
      .bar{height:18px;background:#137c8b}
      .bar-value{width:78px;padding-left:8px;font-size:12px;font-weight:700;color:#243b53}
      .axis-note{margin:13px 0 0;font-size:11px;color:#829ab1;text-align:right}
      .action{margin-top:18px;padding:14px 16px;border-left:4px solid #f0b429;background:#fffbea;color:#513c06;line-height:1.45}
      .footer{padding:0 24px 24px}
      .open-link{display:inline-block;padding:11px 16px;border-radius:6px;background:#137c8b;color:#fff;text-decoration:none;font-weight:700}
      .fallback-note{margin-top:12px;font-size:11px;color:#829ab1}
      @media(max-width:520px){.shell{padding:8px}.header,.content{padding:18px}.bar-value{width:64px}}
    </style>
  </head>
  <body>
    <amp-state id="metric"><script type="application/json">{{INITIAL_METRIC_JSON}}</script></amp-state>
    <div class="shell">
      <div class="report">
        <div class="header">
          <div class="eyebrow">Interactive weekly report · {{REPORT_DATE}}</div>
          <h1>Sales performance pulse</h1>
        </div>
        <div class="content">
          <p class="summary">{{SUMMARY}}</p>
          <div aria-label="Choose a metric">
            {{AMP_BUTTONS}}
          </div>
          {{AMP_PANELS}}
          <div class="action"><strong>Next action</strong><br>{{ACTION}}</div>
        </div>
        <div class="footer">
          <a class="open-link" href="{{DASHBOARD_URL}}">Open full report</a>
          <div class="fallback-note">Buttons change the chart inside supported email clients.</div>
        </div>
      </div>
    </div>
  </body>
</html>
