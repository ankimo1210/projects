# Workspace-level pre-commit hooks.
# Install once: `pip install pre-commit && pre-commit install` (or `uv tool install pre-commit`).
# Project-local ruff configs are respected by passing files to the hook.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(ipynb|md)$'
      - id: end-of-file-fixer
        exclude: '\.(ipynb|md)$'
      - id: check-yaml
        exclude: '^(.*/templates/.*\.ya?ml|.*\.code-workspace)$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
        exclude: '^papers/'
      - id: detect-private-key

  # Use the workspace's own ruff (root uv.lock) so the hook, `make lint`, and
  # `make fmt` cannot drift to different ruff versions.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
