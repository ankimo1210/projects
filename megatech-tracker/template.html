<style>
/*__TOKENS__*/

/* ---------- tracker: denser than a report ---------- */
body{line-height:1.7;padding:0 24px 80px}
.wrap{max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:34px 0 14px}
.top h1{font-size:clamp(26px,3.2vw,36px);margin:6px 0 0}
.asof{font-family:var(--mono);font-size:var(--text-caption);color:var(--ink-3);text-align:right;line-height:1.8}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:5;
  background:var(--ground);padding:10px 0;border-bottom:1px solid var(--rule)}
nav.tabs a{font-size:var(--text-small);text-decoration:none;color:var(--ink-2);padding:5px 13px;
  border-radius:var(--r-chip);border:1px solid var(--rule-2)}
nav.tabs a.co{font-family:var(--mono);font-size:var(--text-label);padding:5px 10px}
nav.tabs a.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
nav.tabs .gap{width:10px}
section{padding:34px 0 0}
h2{font-size:clamp(21px,2.3vw,27px)}
.lead{color:var(--ink-2);margin:8px 0 0;max-width:var(--measure)}
figure{margin:18px 0 0;padding:20px 22px 14px}
.figsub{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2 figure{margin-top:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{font-family:var(--mono);font-size:var(--text-label);line-height:1.6;padding:2px 10px;border:1px solid var(--rule-2);
  border-radius:var(--r-chip);background:none;color:var(--ink-2);cursor:pointer}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.banner{display:block;margin:22px 0 0;padding:14px 18px;background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--accent-soft);border-radius:var(--r-card);color:var(--ink);text-decoration:none;font-size:var(--text-small)}
.banner b{font-weight:700}
.banner .go{color:var(--accent);white-space:nowrap}
.strip{margin-top:20px}
.strip .v{font-size:30px;margin-top:8px}
.strip .v small{font-size:15px;font-weight:600;margin-left:4px}
.tw{margin-top:18px}
table{font-size:var(--text-label)}
th,td{padding:8px 10px}
th{white-space:normal;line-height:1.4;vertical-align:bottom}
td.l,th.l{text-align:left}
td .sub{display:block;font-size:var(--text-caption);color:var(--ink-3);line-height:1.4}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--surface-3)}
th.sort{cursor:pointer;user-select:none}
th.sort.on{color:var(--ink)}
.muted{color:var(--ink-3)}
.caveat{font-size:var(--text-label);color:var(--ink-3);line-height:1.75;margin:10px 0 0;max-width:880px}
.note{max-width:none}
footer{margin-top:56px}
footer li{margin:6px 0;padding-left:16px}
footer ul{max-width:none;margin:8px 0}
footer li::before{top:.9em;width:6px}
.hit{cursor:crosshair}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline}
.sw.o{border-radius:50%}
.chip i.o{width:9px;height:9px;border-radius:50%}
nav.tabs a.co .sw{width:8px;height:8px;margin-right:5px}
nav.tabs a.co.on .sw{box-shadow:0 0 0 1.5px var(--ground)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><b>MEGATECH TRACKER</b><span>試作</span></div>
      <h1>メガテックと AI 半導体の決算と株価</h1>
    </div>
    <div class="asof" id="asof"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<div id="tip" role="status"></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const CO = Object.fromEntries(D.companies.map(c => [c.ticker, c]));
// Color follows the company: its slot in its group, in the template's validated
// categorical order. Eleven companies outrun eight colors, so each group gets
// its own chart and the second group's swatches are round.
const CAT = {}, ROUND = {};
D.groups.forEach((g, gi) => g.tickers.forEach((t, i) => { CAT[t] = `var(--cat-${i + 1})`; ROUND[t] = gi > 0; }));
const sw = t => `<i class="sw${ROUND[t] ? " o" : ""}" style="background:${CAT[t]}"></i>`;
// The next results date, or the last one when Yahoo has not moved on yet.
function nextOf(c) {
  const last = c.events[c.events.length - 1];
  if (c.next_earnings && (!last || c.next_earnings > last.date)) return {date: c.next_earnings, done: false, estimate: c.next_earnings_estimate};
  return last ? {date: last.date, done: true} : null;
}
const MILLION = 1e6;

/* ---------- formatting ---------- */
const MINUS = "−";
const sgn = v => (v > 0 ? "+" : v < 0 ? MINUS : "");
const fmtPct = (v, n = 1) => v == null ? "—" : sgn(v) + Math.abs(v * 100).toFixed(n) + "%";
const fmtShare = (v, n = 1) => v == null ? "—" : (v * 100).toFixed(n) + "%";
const fmtMillion = v => v == null ? "—" : (v < 0 ? MINUS : "") + Math.round(Math.abs(v) / MILLION).toLocaleString("en-US");
// Market cap always reads in trillion dollars so a cross-company column (the
// comparison table) doesn't mix units the way the adaptive fmtMoney would.
const fmtCap = v => v == null ? "—" : (v < 0 ? MINUS : "") + (Math.abs(v) / 1e12).toFixed(2) + " trillion ドル";
const fmtMoney = v => {
  if (v == null) return "—";
  const a = Math.abs(v), sign = v < 0 ? MINUS : "";
  // Billion is the natural middle step so a near-trillion figure (payer capex)
  // reads as "691.0 billion" instead of an unwieldy 6-digit million count.
  if (a >= 1e12) return sign + (a / 1e12).toFixed(2) + " trillion ドル";
  if (a >= 1e9) return sign + (a / 1e9).toFixed(1) + " billion ドル";
  return fmtMillion(v) + " million ドル";
};
const fmtX = v => v == null ? "—" : v.toFixed(1) + "倍";
const fmtPrice = v => v == null ? "—" : "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtMD = s => s ? (+s.slice(5, 7)) + "/" + (+s.slice(8, 10)) : "—";
const ms = s => Date.parse(s + "T00:00:00Z");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ---------- DOM & SVG helpers (from the claude-report skeleton) ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
const CSSATTR = new Set(["fill", "stroke", "font-family"]);
const el = (t, a = {}) => {
  const e = document.createElementNS(SVGNS, t);
  for (const k in a) {
    const v = String(a[k]);
    if (CSSATTR.has(k) && v.indexOf("var(") >= 0) e.style.setProperty(k, v); else e.setAttribute(k, a[k]);
  }
  return e;
};
const txt = (x, y, s, a = {}) => { const t = el("text", {x, y, "font-size": 12, ...a}); t.textContent = s; return t; };
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text; tip.style.opacity = 1;
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY - hh - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
function bind(node, text) {
  node.addEventListener("pointerenter", e => showTip(text, e));
  node.addEventListener("pointermove", e => showTip(text, e));
  node.addEventListener("pointerleave", hideTip);
  node.classList.add("hit");
}

/* ---------- charts ---------- */
let DRAWS = [];
function chart(host, draw) {
  const run = () => { host.innerHTML = ""; draw(host, Math.max(320, host.clientWidth)); };
  DRAWS.push(run); run();
  return run;
}
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => DRAWS.forEach(f => f()), 150); });

function niceTicks(lo, hi, n = 4) {
  if (!(hi > lo)) hi = lo + (Math.abs(lo) || 1);
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function timeTicks(t0, t1) {
  const days = (t1 - t0) / 864e5, out = [];
  const d = new Date(t0); d.setUTCDate(1); d.setUTCHours(0, 0, 0, 0);
  if (days <= 45) {
    const w = new Date(t0); w.setUTCHours(0, 0, 0, 0);
    while (w.getUTCDay() !== 1) w.setUTCDate(w.getUTCDate() + 1);
    for (; +w <= t1; w.setUTCDate(w.getUTCDate() + 7)) out.push([+w, (w.getUTCMonth() + 1) + "/" + w.getUTCDate()]);
    return out;
  }
  const every = days <= 120 ? 1 : days <= 420 ? 3 : 12;
  if (every === 12) d.setUTCMonth(0);
  for (; +d <= t1; d.setUTCMonth(d.getUTCMonth() + every)) {
    if (+d < t0) continue;
    const m = d.getUTCMonth() + 1;
    out.push([+d, every === 12 ? String(d.getUTCFullYear()) : (m === 1 ? d.getUTCFullYear() + "/1" : m + "月")]);
  }
  return out;
}

/* Line chart. cfg: {x:[ms], series:[{name,values,color,width,dash,opacity,label}], yfmt,
   height, yZero, ref, tip(i), markers:[{x, text}], rightPad} */
function lineChart(host, W, cfg) {
  const H = cfg.height || 280, m = {l: 58, r: cfg.rightPad ?? 70, t: 14, b: cfg.markers ? 40 : 28};
  const xs = cfg.x, n = xs.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  let lo = Infinity, hi = -Infinity;
  for (const s of cfg.series) for (const v of s.values) if (v != null && isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (cfg.yZero) lo = Math.min(lo, 0);
  if (cfg.ref != null) { lo = Math.min(lo, cfg.ref); hi = Math.max(hi, cfg.ref); }
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x0 = xs[0], x1 = xs[n - 1];
  const X = v => m.l + (x1 === x0 ? iw / 2 : (v - x0) / (x1 - x0) * iw);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": cfg.label || ""});
  for (const t of ticks) {
    svg.append(el("line", {x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1}));
    svg.append(txt(m.l - 8, Y(t) + 4, cfg.yfmt(t), {"text-anchor": "end", fill: "var(--ink-3)"}));
  }
  if (cfg.ref != null) svg.append(el("line", {x1: m.l, x2: m.l + iw, y1: Y(cfg.ref), y2: Y(cfg.ref), stroke: "var(--rule-2)", "stroke-width": 1}));
  const xt = cfg.xticks ? cfg.xticks : timeTicks(x0, x1);
  for (const [v, lab] of xt) {
    const px = X(v), anchor = px > m.l + iw - 24 ? "end" : px < m.l + 24 ? "start" : "middle";
    svg.append(txt(px, H - (cfg.markers ? 22 : 8), lab, {"text-anchor": anchor, fill: "var(--ink-3)"}));
  }
  const labels = [];
  for (const s of cfg.series) {
    let d = "", pen = false, lastI = -1;
    s.values.forEach((v, i) => {
      if (v == null || !isFinite(v)) { pen = false; return; }
      d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(v).toFixed(1); pen = true; lastI = i;
    });
    svg.append(el("path", {d, fill: "none", stroke: s.color, "stroke-width": s.width || 2, "stroke-dasharray": s.dash || "none",
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: s.opacity ?? 1}));
    if (s.label && lastI >= 0) labels.push({y: Y(s.values[lastI]), x: X(xs[lastI]), text: s.label, strong: s.strong, key: s.swatch ? s.color : null, dash: s.dash, opacity: s.opacity ?? 1});
  }
  // direct labels at the right end, pushed apart so they never collide
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 15);
  for (const L of labels) {
    if (L.key && L.dash) svg.append(el("line", {x1: L.x + 6, x2: L.x + 17, y1: L.y, y2: L.y, stroke: L.key, "stroke-width": 2, "stroke-dasharray": "3 2"}));
    else if (L.key) svg.append(el("circle", {cx: L.x + 12, cy: L.y, r: 4, fill: L.key, opacity: L.opacity}));
    svg.append(txt(L.x + (L.key ? 20 : 8), L.y + 4, L.text, {fill: L.strong ? "var(--ink)" : "var(--ink-2)", "font-weight": L.strong ? 600 : 400}));
  }
  if (cfg.markers) {
    for (const mk of cfg.markers) {
      if (mk.x < x0 || mk.x > x1) continue;
      const cx = X(mk.x), y = m.t + ih + 6;
      const p = el("path", {d: `M${cx - 5},${y + 9}L${cx},${y}L${cx + 5},${y + 9}Z`, fill: "var(--ink-3)"});
      const hit = el("rect", {x: cx - 8, y: y - 2, width: 16, height: 14, fill: "transparent"});
      bind(hit, mk.text);
      svg.append(p, hit);
    }
  }
  if (cfg.tip) {
    const cross = el("line", {y1: m.t, y2: m.t + ih, stroke: "var(--ink-3)", "stroke-width": 1, opacity: 0});
    const dots = cfg.series.filter(s => s.dot !== false).map(s => { const c = el("circle", {r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0}); return [s, c]; });
    const over = el("rect", {x: m.l, y: m.t, width: iw, height: ih, fill: "transparent"});
    over.classList.add("hit");
    over.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
      const target = x0 + (px - m.l) / iw * (x1 - x0);
      let a = 0, b = n - 1;
      while (b - a > 1) { const mid = (a + b) >> 1; if (xs[mid] < target) a = mid; else b = mid; }
      const i = Math.abs(xs[a] - target) <= Math.abs(xs[b] - target) ? a : b;
      cross.setAttribute("x1", X(xs[i])); cross.setAttribute("x2", X(xs[i])); cross.setAttribute("opacity", 1);
      for (const [s, c] of dots) {
        const v = s.values[i];
        if (v == null) { c.setAttribute("opacity", 0); continue; }
        c.setAttribute("cx", X(xs[i])); c.setAttribute("cy", Y(v)); c.setAttribute("opacity", s.opacity ?? 1);
      }
      showTip(cfg.tip(i), e);
    });
    over.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); dots.forEach(([, c]) => c.setAttribute("opacity", 0)); hideTip(); });
    svg.append(cross, ...dots.map(([, c]) => c), over);
  }
  host.append(svg);
}

/* Bar chart over categories. cfg: {cats, series:[{name,values,color}], stacked, yfmt, tip(i), height} */
function barChart(host, W, cfg) {
  const H = cfg.height || 240, m = {l: 58, r: 12, t: 12, b: 28};
  const n = cfg.cats.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  let lo = 0, hi = 0;
  for (let i = 0; i < n; i++) {
    if (cfg.stacked) {
      let pos = 0, neg = 0;
      for (const s of cfg.series) { const v = s.values[i] || 0; if (v >= 0) pos += v; else neg += v; }
      hi = Math.max(hi, pos); lo = Math.min(lo, neg);
    } else for (const s of cfg.series) { const v = s.values[i]; if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } }
  }
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img"});
  for (const t of ticks) {
    svg.append(el("line", {x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--rule-2)" : "var(--grid)", "stroke-width": 1}));
    svg.append(txt(m.l - 8, Y(t) + 4, cfg.yfmt(t), {"text-anchor": "end", fill: "var(--ink-3)"}));
  }
  const band = iw / n, k = cfg.stacked ? 1 : cfg.series.length;
  const bw = Math.max(2, Math.min(28, (band * 0.72 - 2 * (k - 1)) / k));
  const every = Math.ceil(n / Math.max(1, Math.floor(iw / 64)));
  // rounded only at the data end; square at the baseline
  const bar = (x, y0, y1, w, color) => {
    const top = Math.min(y0, y1), bot = Math.max(y0, y1), r = Math.min(4, w / 2, bot - top);
    const d = y1 < y0
      ? `M${x},${bot}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${bot}Z`
      : `M${x},${top}V${bot - r}Q${x},${bot} ${x + r},${bot}H${x + w - r}Q${x + w},${bot} ${x + w},${bot - r}V${top}Z`;
    return el("path", {d, fill: color});
  };
  for (let i = 0; i < n; i++) {
    const cx = m.l + band * (i + 0.5);
    const g = el("g");
    if (cfg.stacked) {
      let pos = 0;
      const live = cfg.series.filter(s => (s.values[i] || 0) > 0);
      live.forEach((s, j) => {
        const v = s.values[i];
        const gap = pos > 0 ? 2 : 0;
        const y0 = Y(pos) - gap, y1 = Y(pos + v);
        if (y0 - y1 > 0.5) g.append(j === live.length - 1 ? bar(cx - bw / 2, y0, y1, bw, s.color) : el("rect", {x: cx - bw / 2, y: y1, width: bw, height: y0 - y1, fill: s.color}));
        pos += v;
      });
    } else {
      cfg.series.forEach((s, j) => {
        const v = s.values[i];
        if (v == null) return;
        const x = cx - (k * bw + 2 * (k - 1)) / 2 + j * (bw + 2);
        g.append(bar(x, Y(0), Y(v), bw, s.color));
      });
    }
    const hit = el("rect", {x: cx - band / 2, y: m.t, width: band, height: ih, fill: "transparent"});
    if (cfg.tip) bind(hit, cfg.tip(i));
    g.append(hit);
    svg.append(g);
    if (i % every === (n - 1) % every) svg.append(txt(cx, H - 8, cfg.cats[i], {"text-anchor": "middle", fill: "var(--ink-3)"}));
  }
  host.append(svg);
}

/* ---------- shared pieces ---------- */
const legend = items => `<div class="legend">${items.map(([name, color, kind]) =>
  `<span><i class="${kind === "sq" ? "sq" : ""}" style="background:${color}${kind === "dash" ? ";background:none;border-top:2px dashed " + color + ";height:0" : ""}"></i>${esc(name)}</span>`).join("")}</div>`;
// "2026年4–6月" -> "26/4–6"; "2025年12月–2026年2月" -> "25/12–2"
const qShort = label => label ? label.replace(/^(\d{4})年(\d+)月?–(?:\d{4}年)?(\d+)月$/, (_, y, a, b) => `${y.slice(2)}/${a}–${b}`) : "";
const yfmtMillion = v => fmtMillion(v);
const yfmtPct = v => (v * 100).toFixed(0) + "%";

function seasonInfo() {
  const rows = D.season.rows;
  const done = rows.filter(r => r.reported).length;
  const next = rows.filter(r => !r.reported && r.next).sort((a, b) => a.next.localeCompare(b.next));
  return {done, next, total: rows.length};
}
function seasonBanner() {
  const s = seasonInfo();
  if (!s.next.length && s.done === 0) return document.createTextNode("");
  const soon = s.next.slice(0, 4).map(r => `${r.ticker} ${fmtMD(r.next)}`).join("、");
  return h(`<a class="banner" href="#season">決算シーズン（${D.season.label}）: <b>${s.done}/${s.total}社 発表済み</b>
    ${soon ? "・ 次は " + soon : ""} <span class="go">→ 決算シーズンへ</span></a>`);
}

/* ---------- views ---------- */
const PERIODS = [["1m", "1か月"], ["3m", "3か月"], ["ytd", "年初来"], ["1y", "1年"], ["5y", "5年"]];
function periodStart(key) {
  const last = new Date(ms(D.prices.dates[D.prices.dates.length - 1]));
  // Months back keep the day, capped at the month's end (Oct 31 -> Sep 30, not Oct 1).
  const back = k => {
    const y = last.getUTCFullYear(), m = last.getUTCMonth() - k;
    return Date.UTC(y, m, Math.min(last.getUTCDate(), new Date(Date.UTC(y, m + 1, 0)).getUTCDate()));
  };
  if (key === "1m") return back(1);
  if (key === "3m") return back(3);
  if (key === "ytd") return Date.UTC(last.getUTCFullYear(), 0, 0);
  if (key === "1y") return back(12);
  return 0;
}
// The base is the last close on or before the period start, as in the table's returns.
function sliceFrom(key) {
  const t = periodStart(key);
  let i = 0;
  while (i < D.prices.dates.length - 1 && ms(D.prices.dates[i + 1]) <= t) i++;
  return i;
}

  };
  const skipped = dropped(q => q.payers_complete, pay, W.payers);
  const skipped2 = dropped(q => q.payers_complete && q.sellers_complete, both, [...W.payers, ...W.sellers]);
  const f2 = h(`<figure><p class="figtitle">払う側${W.payers.length}社の設備投資と営業キャッシュフロー</p>
    <p class="figsub">四半期・ million ドル。${W.payers.length}社がそろった四半期のみ。Oracle は6–8月期などを近い暦四半期に寄せた</p>
    ${legend([["設備投資", "var(--series-1)"], ["営業CF", "var(--series-2)"]])}
    <div id="capex"></div><figcaption><b>Fig 5</b>${skipped}設備投資は有形固定資産の取得（現金）。ファイナンスリースは含まない。</figcaption></figure>`);
  const f3 = h(`<figure><p class="figtitle">払う側の設備投資と受け取る側の売上</p>
    <p class="figsub">四半期・ million ドル。受け取る側は ${names(W.sellers)} の売上の合計。決算期のずれは近い暦四半期に寄せた</p>
    ${legend([[`払う側${W.payers.length}社の設備投資`, "var(--series-1)"], [`受け取る側${W.sellers.length}社の売上`, "var(--series-2)"]])}
    <div id="sellers"></div><figcaption><b>Fig 6</b>${skipped2}受け取る側の売上は AI 以外（ゲーム用 GPU、パソコン向けメモリ、VMware のソフトなど）も含む。</figcaption></figure>`);
  g.append(f2, f3);
  const gs = h(`<section style="padding-top:0"></section>`); gs.append(g); v.append(gs);
  const qchart = (host, Wd, qs, series, tip) => {
    const qticks = qs.map((q, i) => [i, q.q.slice(2).replace("Q", "/Q")]).filter((_, i) => i % 4 === (qs.length - 1) % 4);
    lineChart(host, Wd, {x: qs.map((_, i) => i), xticks: qticks, height: 260, yZero: true, yfmt: yfmtMillion, rightPad: 16, series, tip});
  };
  chart(f2.querySelector("#capex"), (host, Wd) => qchart(host, Wd, pay,
    [{name: "設備投資", values: pay.map(q => q.capex), color: "var(--series-1)"}, {name: "営業CF", values: pay.map(q => q.ocf), color: "var(--series-2)"}],
    i => `${pay[i].q}\n設備投資 ${fmtMoney(pay[i].capex)}\n営業CF   ${fmtMoney(pay[i].ocf)}\n比率     ${fmtShare(pay[i].capex / pay[i].ocf, 0)}`));
  chart(f3.querySelector("#sellers"), (host, Wd) => qchart(host, Wd, both,
    [{name: "設備投資", values: both.map(q => q.capex), color: "var(--series-1)"}, {name: "売上", values: both.map(q => q.sales), color: "var(--series-2)"}],
    i => `${both[i].q}\n払う側の設備投資   ${fmtMoney(both[i].capex)}\n受け取る側の売上   ${fmtMoney(both[i].sales)}`));

  const rows = D.companies.map(c => `<tr class="go" data-t="${c.ticker}"><td class="l">${sw(c.ticker)}<b>${c.ticker}</b><span class="sub">${esc(c.latest_quarter)}まで</span></td>
    <td class="num">${fmtMillion(c.ocf_ttm)}</td><td class="num">${fmtMillion(c.capex_ttm)}</td>
    <td class="num">${c.ocf_ttm && c.capex_ttm != null ? fmtShare(c.capex_ttm / c.ocf_ttm, 0) : "—"}</td><td class="num">${fmtMillion(c.fcf_ttm)}</td>
    <td class="num">${fmtMillion(c.returns_ttm)}</td><td class="num">${fmtMillion(c.debt_change_1y)}</td><td class="num">${fmtMillion(c.net_cash)}</td></tr>`).join("");
  const t = h(`<section><div class="head"><h2>お金の出入り（直近4四半期・ million ドル）</h2></div><div class="tw"><table>
    <thead><tr><th class="l">会社</th><th>営業CF</th><th>設備投資</th><th>設備投資÷営業CF</th><th>FCF</th><th>株主還元</th><th>借入の増減（1年）</th><th>純現金</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="caveat">株主還元 = 自社株買い＋配当。借入の増減は四半期末の借入残高の1年前との差（社債・CP など、リースを除く）。自社株買いは買い戻し枠による分だけで、株式報酬の源泉徴収のための買い取りは含まない。</p></section>`);
  t.querySelector("tbody").addEventListener("click", e => { const tr = e.target.closest("tr[data-t]"); if (tr) location.hash = "co/" + tr.dataset.t; });
  v.append(t);
}

function renderCompany(v, c) {
  const q = c.quarters;
  const n = nextOf(c);
  const nextTxt = !n ? "—" : fmtMD(n.date) + (n.done ? "<small>発表済み</small>" : n.estimate ? "<small>未確定</small>" : "<small>引け後</small>");
  v.append(h(`<section><div class="head"><h2>${sw(c.ticker)}${esc(c.name)}（${c.ticker}）</h2></div>
    <div class="strip">
      <div><span class="k">株価（${D.asof.prices}）</span><span class="v">${fmtPrice(c.price)}</span><span class="n">前日比 ${fmtPct(c.chg_1d)} ・ 年初来 ${fmtPct(c.ret_ytd)}</span></div>
      <div><span class="k">時価総額</span><span class="v">${c.market_cap == null ? "—" : `${(c.market_cap / 1e12).toFixed(2)}<small> trillion ドル</small>`}</span><span class="n">S&amp;P 500 の ${fmtShare(c.spy_weight)}</span></div>
      <div><span class="k">予想PER / 実績PER</span><span class="v a">${fmtX(c.per_ntm)}</span><span class="n">実績 ${fmtX(c.per_ttm)} ・ 今後12か月の予想EPS ${c.eps_ntm == null ? "—" : "$" + c.eps_ntm}</span></div>
      <div><span class="k">次の決算</span><span class="v">${nextTxt}</span><span class="n">最新の四半期 ${esc(c.latest_quarter)}</span></div>
    </div></section>`));

  const f = h(`<section><figure><p class="figtitle">株価</p><p class="figsub">ドル・終値。▲ は決算発表（引け後）。▲ にカーソルを当てると翌日の反応</p>
    <div class="chips" id="cop"></div><div id="cprice"></div>
    <figcaption><b>Fig 1</b>決算日は SEC への 8-K 提出（項目 2.02）から。</figcaption></figure></section>`);
  v.append(f);
  const chips = f.querySelector("#cop");
  const paintChips = () => { chips.innerHTML = PERIODS.map(([k, l]) => `<button class="chip ${STATE.coPeriod === k ? "on" : ""}" data-k="${k}">${l}</button>`).join(""); };
  const redraw = chart(f.querySelector("#cprice"), (host, W) => {
    const i0 = sliceFrom(STATE.coPeriod), dates = D.prices.dates.slice(i0), vals = D.prices[c.ticker].slice(i0);
    lineChart(host, W, {x: dates.map(ms), height: 300, yfmt: v => "$" + v.toFixed(0), rightPad: 16,
      series: [{name: c.ticker, values: vals, color: CAT[c.ticker], width: 2}],
      markers: c.events.map(e => ({x: ms(e.date), text: `${e.date} 決算（${e.quarter || "—"}）\n${e.move == null ? "翌日の取引待ち" : `翌日 ${fmtPct(e.move)}（S&P 500 との差 ${fmtPct(e.vs_index)}）`}`})),
      tip: i => `${dates[i]}\n${fmtPrice(vals[i])}`});
  });
  paintChips();
  chips.addEventListener("click", e => { const k = e.target.closest("[data-k]"); if (!k) return; STATE.coPeriod = k.dataset.k; paintChips(); redraw(); });

  const cats = q.map(r => qShort(r.label));
  const g = h(`<div class="grid2"></div>`);
  const fig = (title, sub, leg, id, cap) => h(`<figure><p class="figtitle">${title}</p><p class="figsub">${sub}</p>${leg || ""}<div id="${id}"></div>${cap ? `<figcaption>${cap}</figcaption>` : ""}</figure>`);
  const fRev = fig("売上", "四半期・ million ドル。棒にカーソルで前年比", "", "c-rev");
  const fOpm = fig("営業利益率", "四半期", "", "c-opm");
  const fCf = fig("営業CFと設備投資", "四半期・ million ドル", legend([["営業CF", "var(--series-2)"], ["設備投資", "var(--series-1)"]]), "c-cf");
  const fRet = fig("株主還元", "四半期・ million ドル", legend([["自社株買い", "var(--series-1)", "sq"], ["配当", "var(--series-2)", "sq"]]), "c-ret");
  const fBs = fig("現金と借入", "四半期末・ million ドル", legend([["現金と有価証券", "var(--series-2)"], ["借入", "var(--series-1)"]]), "c-bs");
  const fPer = fig("実績PER", `週次・倍。直近4四半期が赤字の週は線を切る。今の予想PER（今後12か月）は ${fmtX(c.per_ntm)}`, "", "c-per");
  g.append(fRev, fOpm, fCf, fRet, fBs, fPer);
  const gs = h(`<section style="padding-top:0"></section>`); gs.append(g); v.append(gs);
  const qx = q.map((_, i) => i), qt = q.map((r, i) => [i, cats[i]]).filter((_, i) => i % 4 === (q.length - 1) % 4);
  chart(fRev.querySelector("#c-rev"), (host, W) => barChart(host, W, {cats, yfmt: yfmtMillion,
    series: [{name: "売上", values: q.map(r => r.revenue), color: "var(--series-1)"}],
    tip: i => `${q[i].label}\n売上 ${fmtMoney(q[i].revenue)}\n前年比 ${fmtPct(q[i].rev_yoy)}`}));
  chart(fOpm.querySelector("#c-opm"), (host, W) => lineChart(host, W, {x: qx, xticks: qt, height: 240, yZero: true, yfmt: yfmtPct, rightPad: 16,
    series: [{name: "営業利益率", values: q.map(r => r.op_margin), color: "var(--series-1)"}],
    tip: i => `${q[i].label}\n営業利益率 ${fmtShare(q[i].op_margin)}\n営業利益 ${fmtMoney(q[i].operating_income)}`}));
  chart(fCf.querySelector("#c-cf"), (host, W) => lineChart(host, W, {x: qx, xticks: qt, height: 240, yZero: true, yfmt: yfmtMillion, rightPad: 16,
    series: [{name: "営業CF", values: q.map(r => r.ocf), color: "var(--series-2)"}, {name: "設備投資", values: q.map(r => r.capex), color: "var(--series-1)"}],
    tip: i => `${q[i].label}\n営業CF   ${fmtMoney(q[i].ocf)}\n設備投資 ${fmtMoney(q[i].capex)}\nFCF      ${fmtMoney(q[i].fcf)}`}));
  chart(fRet.querySelector("#c-ret"), (host, W) => {
    if (!q.some(r => r.buybacks || r.dividends)) { host.append(h(`<p class="muted">この期間に自社株買いと配当はない。</p>`)); return; }
    barChart(host, W, {cats, stacked: true, yfmt: yfmtMillion,
      series: [{name: "自社株買い", values: q.map(r => r.buybacks), color: "var(--series-1)"}, {name: "配当", values: q.map(r => r.dividends), color: "var(--series-2)"}],
      tip: i => `${q[i].label}\n自社株買い ${fmtMoney(q[i].buybacks)}\n配当       ${fmtMoney(q[i].dividends)}`});
  });
  chart(fBs.querySelector("#c-bs"), (host, W) => lineChart(host, W, {x: qx, xticks: qt, height: 240, yZero: true, yfmt: yfmtMillion, rightPad: 16,
    series: [{name: "現金と有価証券", values: q.map(r => r.liquid), color: "var(--series-2)"}, {name: "借入", values: q.map(r => r.debt), color: "var(--series-1)"}],
    tip: i => `${q[i].label}\n現金と有価証券 ${fmtMoney(q[i].liquid)}\n借入           ${fmtMoney(q[i].debt)}`}));
  chart(fPer.querySelector("#c-per"), (host, W) => {
    const s = c.per_series;
    if (!s.some(r => r[1] != null)) { host.append(h(`<p class="muted">利益が赤字の期間しかなく、PER を出せない。</p>`)); return; }
    lineChart(host, W, {x: s.map(r => ms(r[0])), height: 240, yZero: true, yfmt: v => v.toFixed(0), rightPad: 16,
      series: [{name: "実績PER", values: s.map(r => r[1]), color: "var(--series-1)"}],
      tip: i => `${s[i][0]}\n実績PER ${s[i][1] == null ? "なし（直近4四半期が赤字）" : fmtX(s[i][1])}`});
  });

  // Yahoo's actual is GAAP for some companies and adjusted for others; the SEC figure says which.
  const gaapFor = day => q.find(r => Math.abs(ms(r.end) - ms(day)) <= 10 * 864e5);
  const eh = c.eps_history.map(r => {
    const g = gaapFor(r.quarter.slice(0, 10)), ge = g ? g.eps : null;
    const basis = ge == null || r.epsActual == null ? "—" : Math.abs(r.epsActual - ge) < 0.015 ? "GAAP" : "調整後など";
    return `<tr><td class="l">${g ? esc(g.label) : r.quarter.slice(0, 7)}</td><td class="num">${r.epsActual ?? "—"}</td><td class="num">${r.epsEstimate != null ? r.epsEstimate.toFixed(2) : "—"}</td>
      <td class="num">${fmtPct(r.surprisePercent)}</td><td class="num">${ge != null ? ge.toFixed(2) : "—"}</td><td class="l">${basis}</td></tr>`;
  }).join("");
  const rc = [...c.revenue_checks].reverse().map(k => `<tr><td class="l">${esc(k.label)}</td><td class="l">${k.release ? fmtMD(k.release) : "未発表"}</td>
    <td class="num">${fmtMoney(k.estimate)}<span class="sub">${fmtMD(k.taken)} 時点・${k.analysts ?? "—"}人</span></td>
    <td class="num">${fmtMoney(k.revenue)}</td><td class="num">${k.surprise != null ? `<b>${fmtPct(k.surprise)}</b>` : "—"}</td></tr>`).join("");
  const per = {"0q": "今の四半期", "+1q": "次の四半期", "0y": "今期", "+1y": "来期"};
  // Yahoo keeps a reported quarter as its current one for a while after the release.
  const eq = c.estimate_quarter;
  const current = !eq ? "「今の四半期」は Yahoo が次に発表されると見ている四半期。"
    : eq.released ? `「今の四半期」は ${esc(eq.label)}。発表済みだが、Yahoo がまだ次の四半期に切り替えていない。`
    : `「今の四半期」は ${esc(eq.label)}（まだ発表されていない最初の四半期）。`;
  const er = (c.estimates.eps || []).map(r => {
    const rv = (c.estimates.revenue || []).find(x => x.period === r.period) || {};
    return `<tr><td class="l">${per[r.period] || r.period}</td><td class="num">${r.avg != null ? r.avg.toFixed(2) : "—"}</td><td class="num">${fmtPct(r.growth)}</td><td class="num">${fmtMoney(rv.avg)}</td><td class="num">${fmtPct(rv.growth)}</td><td class="num">${r.numberOfAnalysts ?? "—"}</td></tr>`;
  }).join("");
  v.append(h(`<section><div class="grid2">
    <div><div class="head"><h2>EPS：実績と予想</h2></div><div class="tw"><table><thead><tr><th class="l">四半期</th><th>実績（Yahoo）</th><th>予想</th><th>差</th><th>GAAP（SEC）</th><th class="l">実績の基準</th></tr></thead><tbody>${eh}</tbody></table></div>
      <p class="caveat">Yahoo の直近4四半期。Yahoo の実績は会社によって GAAP と調整後（株式報酬などを除く）が混ざる。「実績の基準」は SEC の GAAP EPS と 1セント以内で一致すれば GAAP。差は Yahoo の実績 ÷ 予想で、一時的な投資損益が入ると大きく振れる。</p></div>
    <div><div class="head"><h2>市場予想</h2></div><div class="tw"><table><thead><tr><th class="l">期間</th><th>EPS</th><th>前年比</th><th>売上</th><th>前年比</th><th>人数</th></tr></thead><tbody>${er}</tbody></table></div>
      <p class="caveat">Yahoo のアナリスト予想の平均。${current}</p></div>
  </div></section>`));
  v.append(h(`<section><div class="head"><h2>売上：発表前の予想と実績</h2></div>
    ${rc ? `<div class="tw"><table><thead><tr><th class="l">四半期</th><th class="l">発表</th><th>発表前の予想</th><th>実績（SEC）</th><th>予想との差</th></tr></thead><tbody>${rc}</tbody></table></div>` : `<p class="muted">まだ保存した予想がない。</p>`}
    <p class="caveat">予想は取得のたびに保存した Yahoo の平均で、決算の 8-K の提出より前の最後の保存を使う（保存は ${D.asof.consensus_from || "—"} から。保存日は日本時間）。実績は 10-Q／10-K が SEC に出てから入る。</p></section>`));

  const recent = [...q].reverse().slice(0, 12);
  const qrows = recent.map(r => `<tr><td class="l">${esc(r.label)}</td><td class="num">${fmtMillion(r.revenue)}</td><td class="num">${fmtPct(r.rev_yoy)}</td>
    <td class="num">${fmtShare(r.op_margin)}</td><td class="num">${fmtMillion(r.net_income)}</td><td class="num">${r.eps != null ? r.eps.toFixed(2) : "—"}</td><td class="num">${fmtMillion(r.ocf)}</td><td class="num">${fmtMillion(r.capex)}</td>
    <td class="num">${fmtMillion(r.fcf)}</td><td class="num">${fmtMillion(r.buybacks)}</td><td class="num">${fmtMillion(r.dividends)}</td><td class="num">${fmtMillion(r.liquid)}</td><td class="num">${fmtMillion(r.debt)}</td></tr>`).join("");
  v.append(h(`<section><div class="head"><h2>四半期の数字（million ドル）</h2></div><div class="tw"><table>
    <thead><tr><th class="l">四半期</th><th>売上</th><th>前年比</th><th>営業利益率</th><th>純利益</th><th>EPS（ドル）</th><th>営業CF</th><th>設備投資</th><th>FCF</th><th>自社株買い</th><th>配当</th><th>現金と有価証券</th><th>借入</th></tr></thead>
    <tbody>${qrows}</tbody></table></div>
    <p class="caveat">SEC EDGAR の XBRL から。第4四半期とキャッシュフローの各四半期は、年度・累計の数字から差し引きで出した。EPS は希薄化後で、今日の株式数の基準にそろえた（第4四半期は純利益 ÷ 年間と第1〜3四半期の株式数から逆算した第4四半期の株式数）。事業別の売上はまだ入っていない（SEC の書類本体の解析が要る）。${c.notes.map(esc).join("")}</p></section>`));
}

/* ---------- router ---------- */
function renderTabs(key) {
  const main = [["overview", "一覧"], ["season", "決算シーズン"], ["world", "世界の中のメガテック"]];
  document.getElementById("tabs").innerHTML = main.map(([k, l]) => `<a href="#${k}" class="${key === k ? "on" : ""}">${l}</a>`).join("")
    + D.groups.map(g => `<span class="gap"></span>` + g.tickers.map(t => `<a class="co ${key === "co/" + t ? "on" : ""}" href="#co/${t}">${sw(t)}${t}</a>`).join("")).join("");
}
function route() {
  let key = location.hash.slice(1) || "overview";
  if (key.startsWith("co/") && !CO[key.slice(3)]) key = "overview";
  renderTabs(key);
  DRAWS = []; hideTip();
  const v = document.getElementById("view"); v.innerHTML = "";
  if (key === "season") renderSeason(v);
  else if (key === "world") renderWorld(v);
  else if (key.startsWith("co/")) renderCompany(v, CO[key.slice(3)]);
  else renderOverview(v);
}
document.getElementById("asof").innerHTML = `株価 ${D.asof.prices} 終値<br>作成 ${D.asof.built}`;
document.getElementById("foot").innerHTML = `<b style="font-family:var(--mono);letter-spacing:.1em">データと定義</b><ul>
  <li>決算の数字: SEC EDGAR の XBRL（companyfacts）。四半期報告書が出るまで、発表直後の四半期は入らない。</li>
  <li>株価・市場予想: Yahoo Finance（終値・アナリスト予想の平均）。決算日: 発表済みは SEC の 8-K（項目 2.02、引け後の提出）、予定は Yahoo（ニューヨークの日付）。</li>
  <li>S&amp;P 500 に占める比率: State Street の SPY 保有比率（${D.asof.spy}）。過去の推移は推定。</li>
  <li>2026-10-28 の照合: 株価は Nasdaq と全日付で一致（差 0.04% 以内）。直近6四半期の財務は Yahoo と一致（現金・借入は会社ごとの定義の違いを除く）。決算日と翌日の反応は Nasdaq と一致。2026-10-31 の追加照合: 10/20〜10/30 の株価は Nasdaq と一致。MSFT・GOOGL・AMZN・META の7–9月期の売上・営業利益・純利益・EPS は決算発表（8-K）と一致。</li></ul>`;
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
route();
</script>
