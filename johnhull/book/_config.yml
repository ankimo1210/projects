title: johnhull — デリバティブの数理を動かして学ぶ
author: Kazumasa
language: ja
only_build_toc_files: true

execute:
  # Every notebook in the book is committed with executed outputs. vol 01-12 and
  # ir_models carry static PNGs of their ipympl figures and vol 13-16 embed
  # plotly.js (renderer plotly_mimetype+notebook); both are written by
  # `verify_core_notebooks.py --write-outputs` and checked for staleness by
  # `make hull-core-notebooks-check`. Opened directly, the notebooks stay
  # interactive. Keep the book build fast and deterministic.
  execute_notebooks: "off"

sphinx:
  config:
    # require.js is required by the notebook-renderer Plotly outputs (vol 13-16,
    # ir_models), which load the embedded plotly.js through `require`. The
    # vendored MIT-licensed copy keeps both build and viewing offline.
    html_static_path:
      - _static
    html_js_files:
      - require.min.js

html:
  use_issues_button: false
  use_repository_button: false
