title: johnhull — デリバティブの数理を動かして学ぶ
author: Kazumasa
language: ja
only_build_toc_files: true

execute:
  # Frontier notebooks (vol 18-28) and the A1-A4 deep dives are committed with
  # executed outputs; the core notebooks (vol 01-12, legacy bsm/ir_models) are
  # committed without outputs and verified by `make hull-core-notebooks-check`.
  # Keep the book build fast and deterministic (same policy as the analytics books).
  execute_notebooks: "off"

sphinx:
  config:
    # require.js is kept for Plotly outputs embedded by nbconvert; the A1-A4
    # deep-dive figures are mimetype-only in the static build (the portal renders
    # them).  The vendored MIT-licensed copy keeps both build and viewing offline.
    html_static_path:
      - _static
    html_js_files:
      - require.min.js

html:
  use_issues_button: false
  use_repository_button: false
