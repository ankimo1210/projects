[project]
name = "market-research"
version = "0.1.0"
description = "Point-in-time local market research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.51",
    "plotly>=5.22",
]

[project.scripts]
market-research = "market_research.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
