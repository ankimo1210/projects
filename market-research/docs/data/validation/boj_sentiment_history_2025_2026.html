*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:var(--text-body); line-height:1.9;
  margin:0; padding:0 24px 120px; -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
.wrap{max-width:var(--wide);margin:0 auto}
.col{max-width:var(--measure)}

/* ---------- masthead ---------- */
.mast{padding:72px 0 40px}
.eyebrow{font-family:var(--mono);font-size:var(--text-caption);font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:baseline}
.eyebrow b{color:var(--accent);font-weight:600}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(38px,6.6vw,68px);
  line-height:1.12;letter-spacing:0;margin:22px 0 0;text-wrap:balance}
h1 .sub{display:block;font-family:var(--sans);font-size:clamp(16px,2vw,21px);
  font-weight:500;line-height:1.7;color:var(--ink-2);margin-top:22px}
.lede{max-width:var(--measure);margin:26px 0 0;color:var(--ink-2);font-size:16.5px}
.lede strong{color:var(--ink);font-weight:700}

/* ---------- key-number strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:12px;margin:40px 0 0}
.strip>div{background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-card);padding:20px 20px 22px}
.strip .k{font-family:var(--mono);font-size:var(--text-label);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);display:block}
.strip .v{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.15;
  display:block;margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip .v.a{color:var(--accent)}
.strip .v.b{color:var(--series-2)}
.strip .n{font-size:var(--text-small);color:var(--ink-3);display:block;margin-top:8px;line-height:1.65}

/* ---------- sections ---------- */
section{padding:72px 0 0}
.head{display:flex;gap:18px;align-items:baseline;margin-bottom:6px}
.step{font-family:var(--mono);font-size:var(--text-label);font-weight:600;color:var(--accent);
  letter-spacing:.1em;padding-top:8px;flex:none}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(25px,3.3vw,34px);
  line-height:1.4;margin:0;text-wrap:balance}
h3{font-weight:700;font-size:15.5px;margin:44px 0 10px;letter-spacing:.02em}
p{margin:16px 0}.col p{max-width:var(--measure)}
strong{font-weight:700}
em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent-wash) 62%);padding:0 2px}
a{color:var(--accent);text-underline-offset:3px}
code{font-family:var(--mono);font-size:.87em;background:var(--surface-2);
  padding:2px 7px;border-radius:var(--r-mark);color:var(--ink-2)}
ul{max-width:var(--measure);padding-left:0;list-style:none;margin:20px 0}
ul li{position:relative;padding-left:24px;margin:14px 0}
ul li::before{content:"";position:absolute;left:3px;top:.78em;width:8px;height:2px;
  border-radius:1px;background:var(--accent-soft)}

/* ---------- ornament (Claude asterisk motif) ---------- */
.burst{display:block;width:22px;height:22px;margin:64px auto 0;opacity:.5}
.burst path{stroke:var(--accent-soft);stroke-width:1.4;stroke-linecap:round}

/* ---------- figures ---------- */
figure{margin:36px 0 0;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-card);padding:26px 26px 20px}
.figtitle{font-weight:700;font-size:15.5px;margin:0 0 3px;letter-spacing:.01em}
.figsub{font-size:var(--text-small);color:var(--ink-3);margin:0 0 18px;line-height:1.65}
figcaption{font-size:var(--text-small);color:var(--ink-2);line-height:1.8;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--rule)}
figcaption b{font-family:var(--mono);font-size:var(--text-caption);letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-right:10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--mono);fill:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;
  font-family:var(--mono);font-size:var(--text-label);color:var(--ink-2);margin:14px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:11px;height:11px;border-radius:2px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:30px 0 0;border:1px solid var(--rule);
  border-radius:var(--r-card);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:var(--text-small);min-width:520px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:var(--mono);font-size:var(--text-label);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;background:var(--surface-3)}
th:first-child,td:first-child{text-align:left}
td.num{font-family:var(--mono)}
tbody tr:last-child td{border-bottom:none}
tr.hl td{background:var(--accent-wash);font-weight:700}
caption{caption-side:top;text-align:left;padding:16px 14px 10px;font-size:var(--text-label);
  color:var(--ink-3);font-family:var(--mono);letter-spacing:.03em}

/* ---------- callout ---------- */
.note{background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--accent-soft);border-radius:var(--r-card);
  padding:18px 22px;margin:32px 0;max-width:var(--measure)}
.note .lab{font-family:var(--mono);font-size:var(--text-label);letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
.note p{margin:8px 0 0;font-size:15.5px;line-height:1.85}

footer{margin-top:80px;padding-top:24px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:var(--text-caption);color:var(--ink-3);line-height:2.1}

/* ---------- tooltip ---------- */
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--ink);color:var(--ground);font-family:var(--mono);font-size:var(--text-label);
  line-height:1.7;padding:9px 12px;border-radius:8px;z-index:99;white-space:pre;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hit{cursor:crosshair}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  body{padding:0 16px 80px}
  figure{padding:18px 15px 14px}
  .mast{padding-top:48px}
}

body{padding:0;background:var(--surface)}
#boj-policy-history{padding:0;color:var(--ink);font-family:var(--sans);font-size:var(--text-small);line-height:1.65}
#boj-policy-history h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;line-height:1.4}
#boj-policy-history p{margin:6px 0}
#boj-policy-history .history-controls{display:flex;flex-wrap:wrap;gap:12px 20px;margin:16px 0}
#boj-policy-history label{display:grid;gap:4px;flex:1;min-width:140px}
#boj-policy-history select{width:100%;max-width:100%;font:inherit;color:var(--ink);background:var(--surface)}
#boj-policy-history .history-meta{color:var(--ink-2);font-size:var(--text-caption)}
#boj-policy-history .history-plot{width:100%;min-width:0;touch-action:pan-y}
#boj-policy-history svg{display:block;width:100%;font-family:var(--sans);font-size:var(--text-caption)}
#boj-policy-history .history-detail{display:grid;gap:3px;margin-top:8px;padding-top:10px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
#boj-policy-history .history-key{display:inline-block;width:16px;height:3px;vertical-align:middle;background:var(--series-1);margin-right:5px}
#boj-policy-history .history-key.rate{background:var(--series-2)}
@media(pointer:coarse){#boj-policy-history select{min-height:44px;font-size:16px}}

    const option = document.createElement('option');
    option.value = String(i);
    option.textContent = row.meeting.replaceAll('-', '/') + ' 会合';
    picker.append(option);
  });
  picker.value = String(selected);

  function el(tag, attrs={}, style={}, text='') {
    const item = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => item.setAttribute(k, v));
    Object.assign(item.style, style);
    if (text) item.textContent = text;
    return item;
  }
  function readout() {
    const row = rows[selected];
    detail.replaceChildren();
    const lines = [
      row.meeting.replaceAll('-', '/') + ' 会合 · 主な意見 ' + row.published_on.replaceAll('-', '/') + ' 公表',
      'BERT指数 ' + signed(row.balance) + ' ／ タカ ' + row.counts.hawkish + '・ハト ' + row.counts.dovish + '・中立 ' + row.counts.neutral + '（' + row.n + '段落）',
      '決定金利 ' + row.rate_percent.toFixed(2) + '％程度'
    ];
    lines.forEach((line,i) => {
      const p = document.createElement(i === 0 ? 'strong' : 'div');
      p.textContent = line;
      detail.append(p);
    });
  }
  function draw() {
    const width = Math.max(260, Math.floor(plot.getBoundingClientRect().width));
    const height = 440;
    const left = 44, right = width - 18;
    const top = {start:36, end:195}, bottom = {start:265, end:390};
    const min = stamp(rows[0].meeting);
    const max = Math.max(...rows.map(row => stamp(row.published_on)));
    const x = day => left + (stamp(day) - min) / (max - min) * (right-left);
    const ySentiment = value => top.end - (value+100)/200 * (top.end-top.start);
    const rateMax = Math.max(1.5, Math.ceil(Math.max(...rows.map(r=>r.rate_percent))*2)/2);
    const yRate = value => bottom.end - value/rateMax * (bottom.end-bottom.start);
    const svg = el('svg', {width, height, viewBox:'0 0 '+width+' '+height, role:'img', 'aria-labelledby':'history-svg-title history-svg-description'});
    svg.append(el('title', {id:'history-svg-title'}, {}, '日銀のBERTセンチメントと決定金利の推移'));
    svg.append(el('desc', {id:'history-svg-description'}, {}, '上段はタカ派段落比率からハト派段落比率を引いた指数。下段は各会合で決めた無担保コール翌日物の誘導目標を階段状に表示。会合選択欄から各数値を確認できます。'));
    const line = (x1,y1,x2,y2,style={}) => svg.append(el('line',{x1,y1,x2,y2}, {stroke:'var(--grid)',strokeWidth:1,...style}));
    const text = (value,px,py,attrs={}) => svg.append(el('text',{x:px,y:py,...attrs},{fill:'var(--ink-2)'},value));
    text('BERTセンチメント指数', left, 17);
    svg.append(el('line', {x1:left-24,y1:13,x2:left-8,y2:13}, {stroke:'var(--series-1)',strokeWidth:3}));
    [-100,0,100].forEach(value => {
      const y=ySentiment(value);
      line(left,y,right,y,value===0?{stroke:'var(--rule-2)'}:{});
      text(signed(value),left-7,y+4,{'text-anchor':'end'});
    });
    text('決定金利（年率％）', left, 242);
    svg.append(el('line', {x1:left-24,y1:238,x2:left-8,y2:238}, {stroke:'var(--series-2)',strokeWidth:3}));
    for(let value=0;value<=rateMax+0.001;value+=0.5){
      const y=yRate(value);
      line(left,y,right,y);
      text(number.format(value),left-7,y+4,{'text-anchor':'end'});
    }
    line(left,top.start,left,top.end,{stroke:'var(--rule-2)'});
    line(left,bottom.start,left,bottom.end,{stroke:'var(--rule-2)'});
    let path='';
    rows.forEach((row,i)=>{path+=(i?' L ':'M ')+x(row[time.value])+' '+ySentiment(row.balance);});
    svg.append(el('path',{d:path},{fill:'none',stroke:'var(--series-1)',strokeWidth:2}));
    let ratePath='M '+x(rows[0].meeting)+' '+yRate(rows[0].rate_percent);
    rows.slice(1).forEach(row=>{ratePath+=' H '+x(row.meeting)+' V '+yRate(row.rate_percent);});
    ratePath+=' H '+right;
    svg.append(el('path',{d:ratePath},{fill:'none',stroke:'var(--series-2)',strokeWidth:2}));
    rows.forEach((row,i)=>{
      const common={'data-tooltip':row.meeting+' 会合：指数 '+signed(row.balance)+'、決定金利 '+row.rate_percent.toFixed(2)+'％'};
      svg.append(el('circle',{cx:x(row[time.value]),cy:ySentiment(row.balance),r:i===selected?5:3,...common},{fill:'var(--series-1)'}));
      svg.append(el('rect',{x:x(row.meeting)-3,y:yRate(row.rate_percent)-3,width:6,height:6,...common},{fill:'var(--series-2)'}));
    });
    const chosen=rows[selected];
    line(x(chosen[time.value]),top.start,x(chosen[time.value]),top.end,{stroke:'var(--ink-3)',strokeDasharray:'3 4',pointerEvents:'none'});
    line(x(chosen.meeting),bottom.start,x(chosen.meeting),bottom.end,{stroke:'var(--ink-3)',strokeDasharray:'3 4',pointerEvents:'none'});
    const candidates = width < 500 ? ['2026-01-01'] : ['2025-04-01','2025-07-01','2025-10-01','2026-01-01','2026-04-01','2026-07-01'];
    const ticks = [rows[0].meeting, ...candidates.filter(day=>stamp(day)>min&&stamp(day)<max), rows[rows.length-1].published_on];
    ticks.forEach((day,i)=>{
      const pos=x(day);
      line(pos,bottom.end,pos,bottom.end+5,{stroke:'var(--rule-2)'});
      const label = i===0||i===ticks.length-1 ? shortDate(day) : day.slice(2,7).replace('-','/');
      text(label,pos,414,{'text-anchor':i===0?'start':i===ticks.length-1?'end':'middle'});
    });
    coordinates={left,right,x,top,bottom};
    plot.replaceChildren(svg);
    readout();
  }
  function select(index) {
    if(index===selected)return;
    selected=index;
    picker.value=String(index);
    draw();
  }
  plot.addEventListener('pointermove', event=>{
    if(event.pointerType==='touch'||!coordinates)return;
    const bounds=plot.getBoundingClientRect();
    const px=event.clientX-bounds.left,py=event.clientY-bounds.top;
    const key=py<coordinates.bottom.start?'published_on':'meeting';
    const field=key==='published_on'?time.value:'meeting';
    if(px<coordinates.left||px>coordinates.right)return;
    let nearest=0,distance=Infinity;
    rows.forEach((row,i)=>{const d=Math.abs(coordinates.x(row[field])-px);if(d<distance){distance=d;nearest=i;}});
    select(nearest);
  });
  plot.addEventListener('click', event=>{
    if(!coordinates)return;
    const bounds=plot.getBoundingClientRect();
    const px=event.clientX-bounds.left,py=event.clientY-bounds.top;
    const field=py<coordinates.bottom.start?time.value:'meeting';
    let nearest=0,distance=Infinity;
    rows.forEach((row,i)=>{const d=Math.abs(coordinates.x(row[field])-px);if(d<distance){distance=d;nearest=i;}});
    select(nearest);
  });
  picker.addEventListener('change',()=>select(Number(picker.value)));
  time.addEventListener('change',()=>{
    timing.textContent=time.value==='meeting'
      ? '主な意見を会合日に戻して表示する事後比較です。当日に公表済みだった情報ではありません。'
      : '上段は公表日、下段は金利の決定日で表示しています。';
    draw();
  });
  new ResizeObserver(draw).observe(plot);
  draw();
})();
</script>
