[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macrokit"
version = "0.1.0"
description = "Point-in-time research platform for Japanese and US macroeconomic indicators"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kazumasa" }]
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
macrokit = "macrokit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macrokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "live: hits a real external API; requires network and API keys",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF"]
ignore = [
    "E501",
    "N803",
    "N806",
    "RUF001", # ambiguous unicode (ministry source data uses full-width GDP/parens)
    "RUF002",
    "RUF003",
]
