# 合成スコアの重み。欠員率と短観DIが「いま採れていない」ことの最も直接的な測度なので重い。
# 有効求人倍率はハローワーク経由の求人・求職しか映さない（大卒総合職・中途エージェント経由が
# 抜ける）ため 0.20 に抑えている。年齢構成・離職率・残業時間は不足の帰結ないし将来圧力。
