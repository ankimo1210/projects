#   job_openings_ratio   厚生労働省「一般職業紹介状況」職業別 有効求人倍率
#                        （全体 約1.2倍。各業種の主要職種で代表させた値）
#   tdb_shortage_pct     帝国データバンク「人手不足に対する企業の動向調査」正社員不足割合
