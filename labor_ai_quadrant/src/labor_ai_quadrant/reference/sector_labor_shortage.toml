# 合成スコアの重み。高いほど重視。合計は正規化されるので相対値でよい。
# 欠員率と有効求人倍率を重くしているのは、この2つが「今この瞬間に採れていない」
# という意味で最も直接的な不足の測度だから。年齢構成・離職率・残業時間は
# 将来圧力および不足の帰結であり、補助的に置く。
[weights]
vacancy_rate_pct = 0.30
job_openings_ratio = 0.25
tdb_shortage_pct = 0.25
age55_share_pct = 0.10
separation_rate_pct = 0.05
overtime_hours_month = 0.05
