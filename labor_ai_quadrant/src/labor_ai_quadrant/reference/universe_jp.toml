# 日本の上場企業ユニバース（キュレーション版 / curated snapshot）
#
# 目的: ネットワーク非接続の環境でも 4象限マップを企業レベルで再現できるようにするための
#       検証済みサブセット。TOPIX 500 相当の主要銘柄を東証33業種の全業種にまたがって収録。
#
# 完全な上場全銘柄（約3,900社）/ TOPIX 500 を使う場合は J-Quants の `/listed/info` から
# code・企業名・Sector33Code を取得して差し替える:
#     python -m labor_ai_quadrant build --universe jquants
# （要 JQUANTS_MAIL_ADDRESS / JQUANTS_PASSWORD と外部ネットワーク。providers/jquants.py 参照）
#
# 列の意味:
#   code            証券コード（4桁）
#   name            銘柄名
#   sector33        東証33業種名（sector_labor_shortage.toml の name と一致すること）
#   labor_intensity 労働集約度の業種平均からの乖離。low / mid / high。
#                   high = 人月・人海戦術型で従業員1人当たり売上が小さい
#                   low  = 装置・知財型で人数が業績を規定しない
#   knowledge_tilt  社内労働のホワイトカラー（=LLMが効く）比率の業種平均からの乖離。
#                   low / mid / high
#
# basis: analyst-assigned tilts. 銘柄コードと33業種は JPX の業種別分類に基づくが、
#        再編・非上場化により変動するため、実運用では J-Quants で検証すること
#        （`python -m labor_ai_quadrant verify-universe`）。

# NOTE: トップレベル配列を先に、[meta] を末尾に置いている（TOML のテーブル解釈のため）。

