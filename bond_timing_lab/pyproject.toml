[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bond-timing-lab"
version = "0.1.0"
description = "Point-in-time test of ML bond-timing signals (TLT/IEF vs cash) after Bianchi-Buechner-Tamoni (2021)"
requires-python = ">=3.12"
dependencies = [
    "macrokit",
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "threadpoolctl>=3.1",
    "yfinance>=0.2.50",
]

[project.scripts]
bond-timing = "bond_timing.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
macrokit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bond_timing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
