[workspace]
resolver = "2"
members = ["crates/eagle-agc-protocol", "crates/eagle-schema", "crates/eagle-dynamics", "crates/eagle-sensors", "apps/eagle-runtime"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
