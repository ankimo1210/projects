schema = 1
name = "pdi-descent"
# Wave 2 M1: the real descent. Truth starts AT the pad-loaded PDI ignition
# point (padload::pdi_truth_state — single source with generate_state), in
# the pad-load's MCI frame: site radial = +X at TLAND, orbit plane = XY.
# [site] lat/lon are therefore NOT used for geometry in pdi mode; the site
# is MCI +X. miss_m carries a documented few-km frame/time-base caveat
# until measured (M1 plan Task 5).

[site]
lat_deg = 0.0            # unused in pdi mode (site ≡ MCI +X at TLAND)
lon_deg = 0.0            # unused in pdi mode
radius_m = 1737400.0     # assumed (mean lunar radius; same as p66-gate)

[gate]
mode = "pdi"
alt_m = 0.0              # unused in pdi mode (state comes from StateCfg)
vz_ms = 0.0              # unused in pdi mode
mass_dry_kg = 7009.0     # derived: descent dry 2339 + ascent stage wet 4670 (Wave 1)
fuel_dps_kg = 7950.0     # derived: LM-5 total at PDI ≈ 15.2 t minus dry+RCS
fuel_rcs_kg = 250.0      # derived: ~287 kg loaded minus separation/DOI usage
inertia_kgm2 = [23000.0, 25000.0, 24000.0]  # assumed (full LM order-of-magnitude; M1 measures)

[agc]
padload = "scenarios/p66-padload.toml"
lm_weight_lbs = 33530.0            # derived: (7009+7950+250) kg = 15209 kg → V48/N47
tland_offset_cs = 36000            # derived: proven burn lead from Wave 1 acceptance
flip_atthold_after_engine_on_s = 2.0   # unused in pdi mode (handover is sim-driven)
lrbypass = true                    # verify-only: fresh start already sets FLAGWRD11 bit15
                                   # (vendor/virtualagc/Luminary099/FRESH_START_AND_RESTART.agc:623); abort if missing

[handover]
# measured: run 3 (build/traces/telem-m1-run3.jsonl). NOT the historical
# 500 ft / 150 m: P64 flies the approach down to ~237 m and hands to P65
# there, and this rope's P65 entry is where the run dies (PROG alarm + the
# guidance stops modulating the throttle — see the ledger note). At 150 m
# the handover therefore never fires inside P64.
#   run 3 at 250 m truth altitude: TIG+639.5 s, MM still 64, vz -1.7 m/s,
#   v_horiz 5.8 m/s, tilt 12.5 deg, DPS 824 kg, AGC's own alt 56 m.
# 250 m fires ~11 s before that run's P64->P65 switch (truth 236 m) and is
# still above its lowest truth altitude (233.7 m), so the gate is crossed
# even if P65 starts first.
alt_m = 250.0

[rod]
# measured: run 3's P64 endgame (above) for the entry rate, run 4 for the
# step SIZE. Values are the commanded VDGVERT DELTA from the P66-entry
# rate, not absolute sink rates: `SimCore` starts its rod bookkeeping at 0
# while STARTP66 seeds VDGVERT from the CURRENT HDOTDISP
# (vendor/virtualagc/Luminary099/
# LUNAR_LANDING_GUIDANCE_EQUATIONS.agc:155-157), so a step of v commands
# entry_rate + v. Entry rate measured at -1.7 m/s, and the handover's own
# selection click adds -0.30 m/s (one ft/s), so entry is ~-2.0 m/s:
#   240 m: -1.5 -> ~-3.5 m/s   (5 clicks)
#    40 m: +0.2 -> ~-1.8 m/s   (6 clicks back)
#    10 m: +0.8 -> ~-1.2 m/s   (2 clicks, touchdown rate)
# PROVISIONAL — this schedule has NOT been validated to a soft landing,
# because P66's own rate loop oscillates on this build. Run 4 used a single
# -8-click step to ~-7.3 m/s and the loop went bang-bang (throttle slamming
# 4.6 kN <-> 46 kN, sink rate swinging -9.5 to +7.4 m/s about the command)
# until the vehicle climbed away and ran the tank dry: v_vert 44.09 m/s.
# These smaller steps (<=6 clicks) halved that — run 5 measured v_vert
# 13.58 m/s — but the limit cycle survives, so the schedule is a starting
# point, not a tuned answer. Suspect: TAUROD/LAG-TAU/MINFORCE/MAXFORCE are
# the only UNVERIFIED scale-chain pad words left (padload::P66_BSCALE_TABLE)
# and they are exactly the P66 force law's gain and limits. See the ledger.
steps = [[240.0, -1.5], [40.0, 0.2], [10.0, 0.8]]

[errors]                 # empty = all OFF (acceptance runs use this)

[acceptance]
# v_vert_max / v_horiz_max: LM touchdown design limits, carried over from
# Wave 1. **NOT YET MET, and deliberately not relaxed to what was
# measured** — the best M1 flight (run 5) hit at v_vert 13.58 m/s and
# v_horiz 66.91 m/s, both of which are the P66 rate-loop oscillation and
# the un-flown attitude, not a landing. Writing those numbers in here
# would turn a known-open blocker into a passing gate.
v_vert_max = 3.0
v_horiz_max = 1.5
# measured: runs 4 and 5 contacted at 11.2 deg and 12.0 deg of tilt. P66
# holds attitude and does not re-orient, so whatever P64 leaves behind is
# what lands: 12.2-14.4 deg at the measured handover point. A 12.0 bar is
# therefore unreachable by construction in this profile; 15.0 clears the
# measured hold with margin without hiding a tip-over.
tilt_max_deg = 15.0
# measured: from ENGINE ON. Runs 3-5 all reached MM64 at TIG+480.6 s and
# runs 4/5 reached MM66 (the handover) at TIG+640.5 / +638.6 s. A stable
# P66 from the measured 245 m entry at ~3 m/s adds ~85 s, i.e. ~725 s
# total; 800 s keeps ~10% margin. (Runs 4/5 ran 866.9 s / 848.6 s, but
# both were the P66 limit cycle porpoising, not descending.)
timeout_s = 800.0
