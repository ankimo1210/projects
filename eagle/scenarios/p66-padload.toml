# https://ibiblio.org/apollo/Documents/Luminary99PadLoads.pdf,
# Table LM5/4.5.1-1. Unlike the older LUM69R2 transcription used for the
# original target block, it gives physical value, scale factor and octal
# side by side. Each physical+b entry below is regression-checked against
# that printed octal in padload.rs.
#
# RADSKAL is zero because this simulator reports instantaneous slant range
# rather than a delayed Doppler range; Apollo 11's flight load is also zero.
# SKALSKAL rescales only RADSKAL's Doppler correction on the low-scale
# branch (`SERVICER.agc:1133-1149`). Because RADSKAL is zero, the Apollo 11
# zero leaves that correction zero on either range scale. Keeping both
# explicit distinguishes a deliberate flight load from an omitted erasable.

