# ---- P66 rate-of-descent cluster --------------------------------------
# b-scales below. NOTE the premise that once stood here -- "velocities in
# this file are at 2^10 m/cs" -- is TRUE for VBRFG/VIGN but FALSE for the
# two words P66's force law actually divides: spike B measured VDGVERT and
# HDOTDISP at b=7 m/cs (below). TAUROD was derived from the wrong one and
# carried b=14 until 2026-07-31.
# Anchors: VDGVERT/HDOTDISP b=7 m/cs (spike B, live), accelerations at
# 2^-4 m/cs^2 (ABRFG "B+04"), MASS at 2^16 kg (HIASCENT "5050 B-16").
# Interpreter DDV/DMP keep fraction arithmetic, so:
#   TAUROD  = vel/acc     -> b = 7 - (-4) = 11, CENTISECONDS  [MEASURED]
#   LAG/TAU = ratio       -> fraction = ratio              (b=0, dimensionless)
#   FORCE   = MASS * acc  -> fraction = F[kg*m/cs^2]/2^12  (b=12, kg*m/cs^2 = 1e4 N)
# None of these is exercised before ENGINE ON; Spike B (P66 live) is the
# empirical authority. RODSCALE is now pinned live (below); TAUROD,
# LAG/TAU, MINFORCE and MAXFORCE remain scale-chain hypotheses.
#
# RODSCALE, measured live (spike B): RODCOMP does "MP RODSCAL1 / DAS
# VDGVERT" (LUNAR_LANDING_GUIDANCE_EQUATIONS.agc:958-963), so the word is
# the per-click VDGVERT increment expressed in VDGVERT's own DP pulses.
# VDGVERT and HDOTDISP are DP b=7 in m/cs: HDOTDISP read back as hi=0o36
# = 491520 pulses while N63 R2 displayed +00756 (75.6 ft/s), and
# 491520 * 2^-21 m/cs = 0.2344 m/cs = 76.9 ft/s -- a 1.7 % match, i.e. the
# LSB is 2^-21 m/cs. One ft/s per click is therefore 0.003048 m/cs =
# 6392 pulses, entered here as value 0.003048 at b=-7 SP. The scale is
# POSITIVE: a down-click loads RODCOUNT = -1, and -1 * RODSCAL1 must lower
# VDGVERT (faster descent).

[[word]]
symbol = "RODSCALE"
physical = { value = 0.003048, b = -7, dp = false }
provenance = "spike-B live calibration (HDOTDISP raw vs N63 R2 display)"
comment = "ROD click scale = 6392 DP pulses of VDGVERT per click = 1 ft/s"

[[word]]
symbol = "TAUROD"
physical = { value = 150.0, b = 11, dp = true }
provenance = "MEASURED live 2026-07-31 (open-loop step test, tests/live_rod_step.rs)"
comment = "ROD time constant, 150 cs = 1.5 s, CENTISECONDS at b=11. Was b=14 until 2026-07-31, which the AGC decoded as 18.75 cs = 0.1875 s -- an 8x too-fast rate loop against THROTLAG's 0.2 s, i.e. the P66 limit cycle."

[[word]]
symbol = "LAG/TAU"
physical = { value = 0.1333, b = 0, dp = true }
provenance = "derived (scale chain); lag 0.2 s / tau 1.5 s"
comment = "lag/TAUROD dimensionless fraction at b=0 -- UNVERIFIED live until Spike B"

[[word]]
symbol = "MINFORCE"
physical = { value = 0.456, b = 12, dp = true }
provenance = "derived (scale chain); 4560 N = 0.456 kg*m/cs^2 (DPS_MIN_N)"
comment = "min P66 force, kg*m/cs^2 at b=12 -- UNVERIFIED live until Spike B"

[[word]]
symbol = "MAXFORCE"
physical = { value = 4.25, b = 12, dp = true }
provenance = "derived (scale chain); 42500 N = 4.25 kg*m/cs^2"
# DELIBERATELY LEFT AT 42500 N on 2026-07-26 when DPS_FTP_N moved to FSAT
# (48145.4 N). Three reasons, in order:
#  1. This word's b-scale is still UNVERIFIED (padload::P66_BSCALE_TABLE),
#     so the newtons it actually lands on in the AGC are a hypothesis. A
#     verified engine constant must not be laundered into an unverified
#     pad word and then read back as if it were confirmed.
#  2. Nothing measured so far says which way this word should move. The
#     "26.8 kN peak" written here first was wrong -- it came from a
#     5-second telemetry sample, and the same commit's ledger note
#     retracted it: the full-rate trace has run 4's P66 thrust stroking
#     0 -> 46706 N, and run 6's 0 -> 48132 N, i.e. the limit cycle does
#     drive the plant to its stop. Those peaks are the PLANT's
#     full-throttle snap (dps_envelope sends any command above 0.6*MAX to
#     FTP), so they do not read back the AGC's own force clamp -- but they
#     do mean this word cannot be assumed slack. What IS known is only that
#     hovering the measured ~7.8 t vehicle needs ~12.6 kN.
#  3. One variable per flight. The M1 flight budget is testing the three
#     engine constants; moving a pad word in the same run would confound
#     the attribution.
# Next task owns the decision: pin the b-scale, then set this from FSAT.
comment = "max P66 force, kg*m/cs^2 at b=12 -- UNVERIFIED live until Spike B"

# ---- Landing radar and P65 constants (M3) -----------------------------
# Apollo 11's actual Luminary 99 prelaunch erasable-load table is the
