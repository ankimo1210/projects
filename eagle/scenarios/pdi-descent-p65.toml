schema = 1
name = "pdi-descent-p65"
# Wave 2 M1, P65 variant: identical to `pdi-descent.toml` except that the
# sim-driven P64->P66 handover is REMOVED, so the rope flies its own
# automatic landing (P64 -> P65) instead. Diagnostic scenario for ledger
# items 2 and 4 -- NOT the acceptance gate.
#
# Wave 2 M1: the real descent. Truth starts AT the pad-loaded PDI ignition
# point (padload::pdi_truth_state — single source with generate_state), in
# the pad-load's MCI frame: site radial = +X at TLAND, orbit plane = XY.
# [site] lat/lon are therefore NOT used for geometry in pdi mode; the site
# is MCI +X. miss_m carries a documented few-km frame/time-base caveat
# until measured (M1 plan Task 5).

[site]
lat_deg = 0.0            # unused in pdi mode (site ≡ MCI +X at TLAND)
lon_deg = 0.0            # unused in pdi mode
radius_m = 1737400.0     # assumed (mean lunar radius; same as p66-gate)

[gate]
mode = "pdi"
alt_m = 0.0              # unused in pdi mode (state comes from StateCfg)
vz_ms = 0.0              # unused in pdi mode
mass_dry_kg = 7009.0     # derived: descent dry 2339 + ascent stage wet 4670 (Wave 1)
fuel_dps_kg = 7950.0     # derived: LM-5 total at PDI ≈ 15.2 t minus dry+RCS
fuel_rcs_kg = 250.0      # derived: ~287 kg loaded minus separation/DOI usage
inertia_kgm2 = [23000.0, 25000.0, 24000.0]  # assumed (full LM order-of-magnitude; M1 measures)

[agc]
padload = "scenarios/p66-padload.toml"
lm_weight_lbs = 33530.0            # derived: (7009+7950+250) kg = 15209 kg → V48/N47
tland_offset_cs = 36000            # derived: proven burn lead from Wave 1 acceptance
flip_atthold_after_engine_on_s = 2.0   # unused in pdi mode (handover is sim-driven)
# Flight 27 (2026-08-02) closed the LR integration path: channel 33 is a
# masked standing discrete, RNRAD receives a positive range magnitude and
# every range/velocity word is replaced by a bounded 28-packet SHINC/SHANC
# load. Full LR flew 00->63->64->66 with zero alarm episodes and tracked the
# bypassed baseline at TIG+360/+420. This variant removes only the forced
# P66 handover so the rope can fly its vector P65 law.
# Run 31 (2026-08-02) is the final measured result: automatic channel-33
# high/low scale switching worked and the rope flew 00->63->64->65 without
# an alarm or PROG frame, but its altitude state ran about 200 m low near the
# surface. P65 hovered high until fuel exhaustion and crashed at 25.90 m/s
# vertical, 1.72 m/s horizontal and 0.9 deg tilt, 865.2 s after ENGINE ON.
# This scenario remains a red diagnostic, not an acceptance gate.
lrbypass = false
                                   # (vendor/virtualagc/Luminary099/FRESH_START_AND_RESTART.agc:623); abort if missing

# NO [handover] BLOCK -- that is the whole point of this scenario.
#
# `pdi-descent.toml` hands the rope from P64 to P66 at 250 m to jump over
# P65, because P65 entry is where earlier runs died with a PROG alarm
# (ledger item 2, code never read). The cost of that jump is item 4:
# P66's law is scalar and vertical (`P66VERTA`/`RODCOMP`), so nothing
# nulls horizontal velocity, and the handover state measured 5.8 m/s of
# it against an acceptance limit of 1.5.
#
# P65's law IS the vector one:
#
#     ACG = (V2FG - VGU) / TAUVERT
#
# (`LUNAR_LANDING_GUIDANCE_EQUATIONS.agc:911-922`.) Nulling horizontal
# velocity is structurally P65's job. `phase9_handover` returns
# immediately when `handover_alt_m` is None (`sim.rs:895`), so omitting
# the block simply lets the rope fly its own P64 -> P65 sequence.
#
# P65 is fully automatic and does not consume RODCOUNT. Runs 28/29 proved
# that retaining the P66 schedule only injects rejected DSKY loads and OPR
# ERR indications during the P65 endgame, so this diagnostic has no clicks.
[rod]
steps = []

[errors]                 # empty = all OFF (acceptance runs use this)

[acceptance]
# Run 31 did not meet these unchanged limits. Do not tune the gate to that
# flight; the purpose of this diagnostic is to make the remaining altitude
# state blocker reproducible.
# v_vert_max / v_horiz_max: LM touchdown design limits, carried over from
# Wave 1. **NOT YET MET, and deliberately not relaxed to what was
# measured** — the best M1 flights hit at v_vert 13.58 m/s (run 5) and
# v_horiz 60.04 m/s (run 6), both of which are the P66 rate-loop
# oscillation and the un-flown attitude, not a landing. Writing those
# numbers in here would turn a known-open blocker into a passing gate.
v_vert_max = 3.0
v_horiz_max = 1.5
# measured: runs 4 and 5 contacted at 11.2 deg and 12.0 deg of tilt, i.e.
# BOTH met the Wave 1 bar of 12.0 (run 5 only just) -- and run 6, on the
# corrected engine constants, contacted at 12.8 deg and MISSED it. This was
# briefly relaxed to 15.0 and is put back: relaxing the one limit some
# flights happened to meet, while correctly refusing to relax
# v_vert/v_horiz, was inconsistent, and run 6 shows the margin was never
# there. P66 holds attitude and does not re-orient, so whatever P64 leaves
# behind is what lands (12.2 deg at run 4's handover, 14.4 deg at run 5's,
# 11.7 deg at run 6's) -- that is a reason to expect this bar to be tight,
# not a reason to move it.
tilt_max_deg = 12.0
# measured: from ENGINE ON. Runs 3-5 all reached MM64 at TIG+480.6 s and
# runs 4/5 reached MM66 (the handover) at TIG+640.5 / +638.6 s; run 6, on
# the corrected engine constants, reached MM64 at TIG+488.6 s and handed
# over at TIG+647.1 s. A stable P66 from the measured ~247 m entry at
# ~3 m/s adds ~85 s, i.e. ~735 s total; 800 s keeps ~9% margin. (Runs 4-6
# ran 866.9 / 848.6 / 865.1 s, but all three were the P66 limit cycle
# porpoising, not descending.)
timeout_s = 800.0
