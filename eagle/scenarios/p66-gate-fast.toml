schema = 1
name = "p66-gate-fast"
# Debug-iteration variant of p66-gate: shorter TIG lead only. NOT the
# acceptance gate — use p66-gate.toml for acceptance runs.

[site]
lat_deg = 0.674          # Tranquility Base; historical
lon_deg = 23.473         # historical
radius_m = 1737400.0     # assumed (mean lunar radius)

[gate]
alt_m = 500.0            # assumed
vz_ms = 0.0              # hover release (freeze-until-engine-on)
mass_dry_kg = 7009.0     # derived: descent dry 2339 + ascent stage wet 4670 (LM_Simulator masses)
fuel_dps_kg = 2000.0     # derived (partial descent load at the gate)
fuel_rcs_kg = 150.0      # derived
inertia_kgm2 = [12000.0, 13500.0, 13000.0]  # assumed (order-of-magnitude from LM_Sim alpha model)

[agc]
padload = "scenarios/p66-padload.toml"
lm_weight_lbs = 20200.0            # derived: (7009+2000+150) kg ≈ 20190 lbs → V48/N47
# measured 2026-07-25: 24000 (the StateCfg default) is TOO TIGHT on this
# host — the pad-load + flag-set + P63 dialog leave less than the 45 s
# pre-TIG margin BURNBABY requires, and the run aborts with FAILREG 01703
# ("IGNITION TIME SLIPPED", P40-P47.agc:101) during P63 entry, before
# ENGINE ON. 36000 (the acceptance gate) completes with room to spare, so
# 30000 splits the difference: 60 s saved against the acceptance gate,
# 60 s of clearance above the measured 24000 failure. Untested live — if
# 01703 reappears, fall back to 36000. See
# docs/superpowers/notes/2026-07-25-wave1-reflight.md (run 2).
tland_offset_cs = 30000            # derived from the 01703 measurement above — debug only
flip_atthold_after_engine_on_s = 2.0   # spike-B calibrated

[rod]
# alt_m → VDGVERT DELTA (m/s) from the P66-entry rate, NOT an absolute sink
# rate — see the same block in p66-gate.toml for the citation.
steps = [[400.0, -3.0], [150.0, -1.5], [30.0, -1.0]]

[errors]                 # empty table = all OFF (acceptance runs use this)

[acceptance]
v_vert_max = 3.0
v_horiz_max = 1.5
tilt_max_deg = 12.0
timeout_s = 300.0
