[project]
name = "quant-research-textbook"
version = "0.1.0"
description = "Japanese-first Jupyter Book for quantitative research and data science"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "plotly>=5.22",
    "jupyter-book>=1.0,<2",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_textbook"]
