[project]
name = "portfolio-analyzer"
version = "0.1.0"
description = "Privacy-first local dashboard for multi-account portfolio analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
