<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>東京の地下鉄 都心部 ｜ 実深さ3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --ink:#141413; --ink-2:#4E4B45; --ink-3:#85817A;
  --surface:#FAF9F5; --surface-2:#EFEDE6; --rule:#DFDBCF;
  --accent:#C05C33; --series-2:#2A6DA6;
  --sans:"Zen Kaku Gothic New",'Hiragino Sans',"Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-card:12px;
}
html,body{margin:0;height:100%;font-family:var(--sans);color:var(--ink);background:var(--ink);overflow:hidden}
#map,#deck{position:absolute;inset:0}
#deck{display:none}
body.underground #deck{display:block} body.underground #map{display:none}
.panel{position:absolute;top:16px;left:16px;width:330px;max-height:calc(100% - 32px);overflow:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);
  padding:14px 16px;box-shadow:0 6px 24px rgba(20,20,19,.25);z-index:2}
h1{font-size:15px;margin:0 0 2px;letter-spacing:.01em}
.sub{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.mode{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:0 0 10px}
.mode button{flex:1;border:0;background:var(--surface);padding:7px 0;font:500 12.5px var(--sans);color:var(--ink-2);cursor:pointer}
.mode button.on{background:var(--ink);color:var(--surface)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px}
.lines label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0}
.lines i{display:inline-block;width:12px;height:12px;border-radius:3px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-2)}
.row input[type=range]{flex:1}
.row select{font:12px var(--sans);max-width:170px}
.keys{font-size:11px;line-height:1.7;color:var(--ink-3);margin-top:8px}
.keys b{font-family:var(--mono);font-weight:500;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.src{font-size:10.5px;line-height:1.6;color:var(--ink-3);margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;display:none}
body.underground .labels{display:block}
.labels div{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:12.5px var(--sans);
  color:var(--surface);background:rgba(20,20,19,.72);border-left:3px solid;padding:2px 6px;border-radius:3px}
.hud{position:absolute;right:16px;bottom:16px;font:11px var(--mono);color:var(--surface);opacity:.8;z-index:2;display:none}
body.underground .hud{display:block}
.ug{display:none} body.underground .row.ug{display:flex} body.underground .keys.ug{display:block}
</style>
</head>
<body>
<div id="map"></div>
<div id="deck"></div>
<div class="labels" id="labels"></div>
<div class="panel">
  <h1>東京の地下鉄 都心部</h1>
  <p class="sub">実測の軌条面標高で描いた地下3D（深さは地表からの値）</p>
  <div class="mode"><button id="m-surface" class="on">地上から</button><button id="m-under">地下から</button></div>
  <div class="lines" id="lines"></div>
  <div class="row ug"><span>駅へ</span><select id="jump"></select></div>
  <div class="row ug"><span>地表</span><select id="tile"><option value="photo" selected>航空写真</option><option value="pale">淡色地図</option></select>
    <span>濃さ</span><input id="op" type="range" min="0" max="100" value="28"></div>
  <div class="row"><span>深さの誇張</span><input id="ve" type="range" min="1" max="6" step="0.5" value="3"><span id="vev">3×</span></div>
  <div class="keys ug">ドラッグ <b>見回す</b>　<b>↑↓</b> 前後　<b>←→</b> 向き　ホイール <b>前進/後退</b>　<b>Q</b>/<b>E</b> 上昇/下降　<b>Shift</b> 高速</div>
  <p class="src" id="src"></p>
</div>
<div class="hud" id="hud"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js"></script>
<script>
const GROUND=[133,129,122], PAPER=[250,249,245], INK=[20,20,19];
const TILES={photo:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
             pale:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
let model=null, VE=3, OP=0.28, TILE='photo', visible={}, mode='surface';
// z は「地表からの深さ」。地図タイルは海抜0mの平面なので、T.P.をそのままzにすると地表が浮く。
const z=p=>(p.rail_tp_m-p.ground_tp_m)*VE;

// ---------- 地上から: MapLibre + deck overlay ----------
const map=new maplibregl.Map({container:'map',
  style:{version:8,sources:{gsi:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
    tileSize:256,attribution:'地理院タイル'}},layers:[{id:'gsi',type:'raster',source:'gsi'}]},
  center:[139.755,35.680],zoom:13.9,pitch:62,bearing:8,maxPitch:85});
let overlay=null;

function lineLayers(ln, under){
  const c=hex(ln.colour), t=ln.track;
  const rail=t.map(p=>[p.lon,p.lat,z(p)]);
  const curtain=t.slice(0,-1).map((p,i)=>{const q=t[i+1];
    return {polygon:[[p.lon,p.lat,0],[q.lon,q.lat,0],[q.lon,q.lat,z(q)],[p.lon,p.lat,z(p)]]};});
  const drops=t.filter((_,i)=>i%2===0).map(p=>({from:[p.lon,p.lat,0],to:[p.lon,p.lat,z(p)]}));
  // 駅は線路上の短い太い区間（ホーム長 ≈ 160m）として描く
  const rooms=ln.stations.map(s=>{const i=nearestIdx(t,s.coord); const a=Math.max(0,i-3), b=Math.min(t.length-1,i+3);
    return {path:t.slice(a,b+1).map(p=>[p.lon,p.lat,z(p)+1.5]),name:s.name};});
  const id=s=>`${ln.key}-${s}`;
  return [
    new deck.SolidPolygonLayer({id:id('curtain'),data:curtain,getPolygon:d=>d.polygon,_full3d:true,
      getFillColor:[...c,under?18:55],material:false,parameters:{depthWriteEnabled:false}}),
    !under&&new deck.PathLayer({id:id('ground'),data:[t.map(p=>[p.lon,p.lat,0])],getPath:d=>d,
      getColor:[...GROUND,200],widthMinPixels:2,getWidth:2}),
    !under&&new deck.LineLayer({id:id('drops'),data:drops,getSourcePosition:d=>d.from,getTargetPosition:d=>d.to,
      getColor:[...c,110],widthMinPixels:1,getWidth:1}),
    new deck.PathLayer({id:id('rail'),data:[rail],getPath:d=>d,getColor:[...c,255],
      widthUnits:'meters',getWidth:under?12:6,widthMinPixels:under?3:4,capRounded:true,jointRounded:true,billboard:!under}),
    new deck.PathLayer({id:id('rooms'),data:rooms,getPath:d=>d.path,getColor:[...PAPER,under?230:255],
      widthUnits:'meters',getWidth:under?16:12,widthMinPixels:under?6:8,capRounded:false,billboard:!under,
      pickable:true}),
    new deck.ScatterplotLayer({id:id('stations'),data:ln.stations,
      getPosition:d=>[d.coord[0],d.coord[1],-d.depth_m*VE+2],
      getFillColor:[...c,255],getLineColor:[...PAPER,255],lineWidthMinPixels:2,stroked:true,
      radiusUnits:'meters',getRadius:under?10:20,radiusMinPixels:4,radiusMaxPixels:9,pickable:true,billboard:under}),
    // TextLayer draws nothing under FirstPersonView; underground labels are DOM overlays (htmlLabels).
    !under&&new deck.TextLayer({id:id('labels'),data:ln.stations,
      getPosition:d=>[d.coord[0],d.coord[1],-d.depth_m*VE+2],
      getText:d=>`${d.name} −${d.depth_m}m`,getSize:under?13:12,characterSet:'auto',
      getColor:under?[...PAPER,235]:[...INK,240],getPixelOffset:[0,-16],
      background:true,getBackgroundColor:under?[...INK,170]:[...PAPER,215],backgroundPadding:[4,2],
      fontFamily:'Zen Kaku Gothic New, sans-serif',fontSettings:{sdf:true,buffer:8},
      // CollisionFilterExtension renders nothing under FirstPersonView, so it is surface-only.
      ...(under?{}:{extensions:[new deck.CollisionFilterExtension()],collisionGroup:'labels',
        getCollisionPriority:d=>d.depth_m,collisionTestProps:{sizeScale:2}}),
      parameters:{depthCompare:'always'}})
  ].filter(Boolean);
}
function nearestIdx(t,c){let b=0,bd=1e9;t.forEach((p,i)=>{const d=(p.lon-c[0])**2+(p.lat-c[1])**2;if(d<bd){bd=d;b=i;}});return b;}
function tooltip({object}){
  if(!object||!object.name)return null;
  if(object.depth_m===undefined) return {html:`<b>${object.name}</b>`};
  return {html:`<b>${object.name}</b>（${object.line}）<br>地盤 ${object.ground_tp_m} m / 軌条 ${object.rail_tp_m} m<br>深さ ${object.depth_m} m`};
}
function allLayers(under){
  return model.lines.filter(l=>visible[l.key]).flatMap(l=>lineLayers(l,under));
}
function surfaceLayers(){ return allLayers(false); }

// ---------- 地下から: deck.gl 単体 FirstPersonView（MapLibre のカメラは地下に潜れない） ----------
let deckgl=null;
let viewState={longitude:139.7668,latitude:35.6822,position:[0,0,-55],bearing:350,pitch:8};
function undergroundLayers(){
  return [
    // 淡色地図は真下から見ると巨大な鏡文字になる。写真は文字が無いので天井として素直に読める。
    new deck.TileLayer({id:'ceil-'+TILE,data:TILES[TILE],minZoom:10,maxZoom:17,tileSize:256,opacity:OP,
      renderSubLayers:p=>{const {west,south,east,north}=p.tile.bbox;
        return new deck.BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north],
          parameters:{depthWriteEnabled:false}});}}),
    ...allLayers(true)
  ];
}
function htmlLabels(){
  const box=document.getElementById('labels'); if(!deckgl||mode!=='underground'){box.innerHTML='';return;}
  let vp; try{vp=deckgl.getViewports()[0];}catch(e){return;}  // asserts before the first render
  if(!vp)return;
  const cam=viewState, cosLat=Math.cos(cam.latitude*Math.PI/180);
  const fwd=[Math.sin(cam.bearing*Math.PI/180),Math.cos(cam.bearing*Math.PI/180)];
  const out=[];
  for(const ln of model.lines){ if(!visible[ln.key])continue;
    for(const s of ln.stations){
      const dx=(s.coord[0]-cam.longitude)*111320*cosLat, dy=(s.coord[1]-cam.latitude)*110540;
      const dist=Math.hypot(dx,dy); if(dist>1800||dx*fwd[0]+dy*fwd[1]<=0)continue;   // behind or far
      const [x,y]=vp.project([s.coord[0],s.coord[1],-s.depth_m*VE+2]);
      if(x<-50||y<-50||x>innerWidth+50||y>innerHeight+50)continue;
      out.push(`<div style="left:${x}px;top:${y-10}px;border-color:${ln.colour};opacity:${dist>1200?0.5:1}">${s.name} −${s.depth_m}m</div>`);
    }}
  box.innerHTML=out.join('');
}
function hud(){htmlLabels();const v=viewState;document.getElementById('hud').textContent=
  `z ${v.position[2].toFixed(0)}m  bearing ${(((v.bearing%360)+360)%360)|0}°  pitch ${v.pitch|0}°`;}
function initUnderground(){
  if(deckgl)return;
  deckgl=new deck.Deck({parent:document.getElementById('deck'),
    views:new deck.FirstPersonView({id:'fp',fovy:60,near:1,far:30000,controller:{keyboard:true,inertia:200}}),
    initialViewState:viewState,parameters:{clearColor:[0.078,0.078,0.075,1]},
    onViewStateChange:({viewState:v})=>{viewState=v;hud();return v;},
    onLoad:()=>hud(),getTooltip:tooltip,layers:undergroundLayers()});
  addEventListener('keydown',e=>{if(mode!=='underground')return;const d=e.key==='q'?8:e.key==='e'?-8:0;if(!d)return;
    viewState={...viewState,position:[viewState.position[0],viewState.position[1],viewState.position[2]+d]};
    deckgl.setProps({viewState});hud();});
  hud();
}
function jumpTo(ln,st){
  // 駅の 140m 東・線路面の 5m 上に立ち、駅の方を向く
  const zs=-st.depth_m*VE+5, dlon=140/(111320*Math.cos(st.coord[1]*Math.PI/180));
  viewState={longitude:st.coord[0]+dlon,latitude:st.coord[1],position:[0,0,zs],bearing:270,pitch:0};
  deckgl.setProps({viewState});hud();
}
function refresh(){
  if(mode==='surface'&&overlay) overlay.setProps({layers:surfaceLayers()});
  if(deckgl) deckgl.setProps({layers:undergroundLayers()});
  hud();
}
function setMode(m){
  mode=m;document.body.classList.toggle('underground',m==='underground');
  document.getElementById('m-surface').classList.toggle('on',m==='surface');
  document.getElementById('m-under').classList.toggle('on',m==='underground');
  if(m==='underground'){initUnderground();} else {map.resize();}
  refresh();
}

fetch('../data/out/model.json').then(r=>r.json()).then(m=>{
  model=m; m.lines.forEach(l=>{visible[l.key]=true; l.stations.forEach(s=>s.line=l.name);});
  const lines=document.getElementById('lines');
  lines.innerHTML=m.lines.map(l=>`<label><input type="checkbox" data-k="${l.key}" checked><i style="background:${l.colour}"></i>${l.name}</label>`).join('');
  lines.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{visible[cb.dataset.k]=cb.checked;refresh();});
  const jump=document.getElementById('jump');
  jump.innerHTML='<option value="">選択…</option>'+m.lines.map(l=>`<optgroup label="${l.name}">`+
    l.stations.map((s,i)=>`<option value="${l.key}:${i}">${s.name} −${s.depth_m}m</option>`).join('')+'</optgroup>').join('');
  jump.onchange=()=>{if(!jump.value)return;const [k,i]=jump.value.split(':');const ln=m.lines.find(l=>l.key===k);jumpTo(ln,ln.stations[+i]);};
  overlay=new deck.MapboxOverlay({interleaved:false,layers:surfaceLayers(),getTooltip:tooltip});
  map.addControl(overlay);
  document.getElementById('m-surface').onclick=()=>setMode('surface');
  document.getElementById('m-under').onclick=()=>setMode('underground');
  document.getElementById('tile').onchange=e=>{TILE=e.target.value;refresh();};
  document.getElementById('op').oninput=e=>{OP=e.target.value/100;refresh();};
  document.getElementById('ve').oninput=e=>{VE=+e.target.value;document.getElementById('vev').textContent=VE+'×';refresh();};
  document.getElementById('src').innerHTML=
    `深さ: ${m.sources.depth}<br>線形: ${m.sources.alignment}<br>地表: ${m.sources.ground}`+
    `<br>${m.lines.length}路線・${m.lines.reduce((n,l)=>n+l.stations.length,0)}駅。深さの絶対値は±3m程度、縦断の形は±0.3m。`;
  window.__setView=v=>{viewState={...viewState,...v};if(deckgl){deckgl.setProps({viewState});hud();}};
  window.__setMode=setMode; window.__jump=(k,i)=>{const ln=m.lines.find(l=>l.key===k);jumpTo(ln,ln.stations[i]);};
});
</script>
</body>
</html>
